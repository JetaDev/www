<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Matrix Generator</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        .controls {
            margin-bottom: 20px;
        }

        #matrix-container {
            margin-top: 20px;
        }

        table {
            border-collapse: collapse;
        }

        td {
            width: 40px;
            height: 40px;
            border: 1px solid #ccc;
            text-align: center;
            vertical-align: middle;
        }

        .diagonal {
            background-color: #e0f7fa;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Identity Matrix Generator</h1>

    <div class="controls">
        <label for="dimension">Dimension (n): </label>
        <input type="number" id="dimension" min="1" value="3">
        <button id="generate-btn">Generate</button>
    </div>

    <div id="matrix-container"></div>

    <hr>

    <h2>3x3 Matrix Transpose</h2>
    <button id="transpose-btn">Generate 3x3 & Transpose</button>
    <div style="display: flex; gap: 20px;">
        <div>
            <h3>Original</h3>
            <div id="original-matrix"></div>
        </div>
        <div>
            <h3>Transposed</h3>
            <div id="transposed-matrix"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
