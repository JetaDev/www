<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!--Crea un formulario HTML que recoja dos valores numéricos a través de
    cuadros de texto y permita seleccionar una operación matemática entre:
    suma, resta, multiplicación, división y módulo. Envía los valores a un archivo
    PHP que realizará la operación indicada entre los dos números y mostrará en
    pantalla el resultado.-->
    <form action="ejer1.php" method="get">
      <label for="numerouno">Numero: </label>
      <input type="number" id="numerouno" name="numerouno" /> <br /><br />
      <label for="numerodos">Numero: </label>
      <input type="number" id="numerodos" name="numerodos" /> <br /><br />

      <label for="operacion">Operacion:</label>
      <select id="operacion" name="operacion" required>
        <option value="suma">Suma</option>
        <option value="resta">Resta</option>
        <option value="multiplicacion">Multiplicacion</option>
        <option value="division">Division</option>
      </select>
      <br /><br />

      <button type="submit" value="Calcular">Calcular</button>
    </form>
  </body>
</html>
