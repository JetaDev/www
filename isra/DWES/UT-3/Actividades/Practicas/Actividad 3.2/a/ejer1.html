<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Pedido</title>
</head>
<body>

    <!--Crea un formulario HTML que recoja los datos de un pedido para una tienda online que
vende 3 tipos de artículos. El formulario deberá recoger el número de unidades solicitadas
de cada tipo. Recoge los valores y genera una factura en la que se indiquen las unidades
vendidas de cada uno de los artículos, su precio unitario (5.99€, 12.49€ y 19.99€
respectivamente), subtotal por artículo e importe total aplicando un 20% de IVA. Usa alguna
función que te permita incluir la fecha de emisión de la factura.-->
    <h1>Formulario de Pedido</h1>
    <form action="factura.php" method="get">
        <label>Artículo 1 (€5.99): </label>
        <input type="number" id="articulo1" name="articulo1" min="0" value="0"><br><br>

        <label>Artículo 2 (€12.49): </label>
        <input type="number" id="articulo2" name="articulo2" min="0" value="0"><br><br>

        <label>Artículo 3 (€19.99): </label>
        <input type="number" id="articulo3" name="articulo3" min="0" value="0"><br><br>

        <button type="submit">Generar Factura</button>
    </form>
</body>
</html>
