<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Flexbox</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="form-container">
        <form class="contact-form">
            <!-- First Name -->
            <div class="form-row">
                <label for="firstname">FIRST NAME</label>
                <input type="text" id="firstname" placeholder="Enter your first name here">
            </div>

            <!-- Last Name -->
            <div class="form-row">
                <label for="lastname">LAST NAME</label>
                <input type="text" id="lastname" placeholder="Enter your last name here">
            </div>

            <!-- Email -->
            <div class="form-row">
                <label for="email">EMAIL</label>
                <input type="email" id="email" placeholder="Enter your email here">
            </div>

            <!-- Phone -->
            <div class="form-row">
                <label for="phone">PHONE</label>
                <input type="tel" id="phone" placeholder="Enter your phone here">
            </div>

            <!-- Message -->
            <div class="form-row">
                <label for="message">MESSAGE</label>
                <textarea id="message" rows="5" placeholder="Enter your message here"></textarea>
            </div>

            <!-- Age -->
            <div class="form-row age-row">
                <label>AGE</label>
                <div class="age-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="age" value="20-29">
                        <span>20-29</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="age" value="30-39">
                        <span>30-39</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="age" value="40-49">
                        <span>40-49</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="age" value="50-59">
                        <span>50-59</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="age" value=">60">
                        <span>>60</span>
                    </label>
                </div>
            </div>
        </form>
    </div>

</body>

</html>
