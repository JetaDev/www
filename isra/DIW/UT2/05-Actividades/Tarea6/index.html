<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Flexbox</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="portfolio-container">
        <header class="portfolio-header">
            <h1>Portfolio</h1>
        </header>

        <div class="gallery">
            <!-- Columna 1 -->
            <div class="column">
                <img src="https://picsum.photos/400/500?random=1" alt="Imagen 1" class="gallery-img">
                <img src="https://picsum.photos/400/300?random=2" alt="Imagen 2" class="gallery-img">
            </div>

            <!-- Columna 2 -->
            <div class="column">
                <img src="https://picsum.photos/400/400?random=3" alt="Imagen 3" class="gallery-img">
                <img src="https://picsum.photos/400/500?random=4" alt="Imagen 4" class="gallery-img">
            </div>

            <!-- Columna 3 -->
            <div class="column">
                <img src="https://picsum.photos/400/350?random=5" alt="Imagen 5" class="gallery-img">
                <img src="https://picsum.photos/400/300?random=6" alt="Imagen 6" class="gallery-img">
                <img src="https://picsum.photos/400/350?random=7" alt="Imagen 7" class="gallery-img">
            </div>

            <!-- Columna 4 -->
            <div class="column">
                <img src="https://picsum.photos/400/600?random=8" alt="Imagen 8" class="gallery-img">
            </div>
        </div>
    </div>

</body>

</html>
